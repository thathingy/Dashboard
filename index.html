<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churchie Dashboard</title>
    <style>
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #060913; font-family: sans-serif; box-sizing: border-box; }
        body { display: flex; flex-direction: row; padding: 35px 45px !important; gap: 40px; justify-content: space-between; position: relative !important; background-image: linear-gradient(145deg, #04060c 0%, #0b1120 100%); }
        .left-col { display: flex; flex-direction: column; width: 52% !important; box-sizing: border-box; }
        .right-col { display: flex; flex-direction: column; width: 40% !important; text-align: right; box-sizing: border-box; }
        .clock { font-size: 4.5rem; font-weight: 200; color: #ffffff; line-height: 1; margin: 0; }
        .date { color: #8a8e99 !important; font-size: 1.2rem; font-weight: 500; letter-spacing: 0.5px; margin: 5px 0 0 0; text-transform: uppercase; }
        .insight { font-size: 1.25rem; font-weight: 400; color: #FFD700; padding: 8px 0 16px 0; }
        .header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #FFD700; border-bottom: 2px solid #1a263f; padding-bottom: 8px; margin-bottom: 14px; text-align: left !important; }
        .right-col .header { text-align: right !important; }
        .timetable-container { overflow-y: hidden !important; max-height: 55vh !important; }
        .timetable { width: 100% !important; border-collapse: separate !important; border-spacing: 0 8px !important; }
        .timetable tr { background: rgba(255,255,255,0.04) !important; border-radius: 6px !important; display: table-row !important; }
        .timetable td { padding: 12px 14px !important; font-size: 13.5px !important; vertical-align: middle !important; color: #ffffff; }
        .timetable td.title { font-weight: 600 !important; text-align: left !important; width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .timetable td.time { color: #FFD700 !important; font-weight: 500; text-align: right !important; width: 40%; border-left: 1px solid rgba(255, 255, 255, 0.08); padding-left: 14px !important; }
        .temp { font-size: 4rem; font-weight: 200; color: #ffffff; margin: 0; }
        #weather-details { font-size: 13px; color: #a2a6b0; margin-bottom: 20px; }
        .forecast-box { width: 100% !important; font-size: 12.5px !important; margin-left: auto !important; }
        .weather-row { display: flex; justify-content: space-between; padding: 6px 8px !important; background: rgba(255,255,255,0.01); color: #ffffff; margin-bottom: 4px; }
        .weather-row .day { color: #a2a6b0 !important; font-weight: 500; text-align: left !important; }
    </style>
</head>
<body>

    <div class="left-col">
        <div class="clock" id="time">--:--</div>
        <div class="date" id="date">Loading Date...</div>
        <div class="insight" id="insight">Connecting to Brisbane weather streams...</div>
        
        <div class="header">7-Day Weekly Timetable</div>
        <div class="timetable-container">
            <table class="timetable" id="events-table">
                <tr><td class="title">Loading timetables...</td><td class="time">Please wait</td></tr>
            </table>
        </div>
    </div>

    <div class="right-col">
        <div class="header">Brisbane Weather</div>
        <div class="temp" id="current-temp">--°C</div>
        <div id="weather-details">Humidity: --%</div>
        
        <div class="header">7-Day Forecast Insights</div>
        <div class="forecast-box" id="forecast-box">Loading forecast rows...</div>
    </div>

    <script>
        // 🔒 INSERT YOUR SECURE CALENDAR iCAL LINKS HERE
        var GOOGLE_ICAL = "https://calendar.google.com/calendar/ical/1382abd753f572abe42c619efb9ee71576d680fd38f5661f4711b23cd3f6d0fd%40group.calendar.google.com/private-ec5db411e0b36493eaa1124c0ddb1565/basic.ics";
        var CHURCHIE_ICAL = "https://my.churchie.com.au/calendar/export.php?export=all&event_type=&token=3ee8dffe24a12abfc929b4a70";

        function updateClock() {
            try {
                var now = new Date();
                var dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                
                document.getElementById("date").innerText = dayNames[now.getDay()] + ", " + monthNames[now.getMonth()] + " " + now.getDate();
                
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById("time").innerText = hours + ':' + minutes + ' ' + ampm;

                if (now.getHours() >= 21 || now.getHours() < 6) {
                    document.body.style.filter = "brightness(0.35)";
                } else {
                    document.body.style.filter = "brightness(1)";
                }
            } catch (err) { }
        }
        setInterval(updateClock, 1000); updateClock();

        function getWeather() {
            var url = "https://open-meteo.com";
            var proxyUrl = "https://corsproxy.io" + encodeURIComponent(url);
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", proxyUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var currentTemp = Math.round(data.current.temperature_2m);
                        document.getElementById("current-temp").innerText = currentTemp + "°C";
                        document.getElementById("weather-details").innerText = "Humidity: " + data.current.relative_humidity_2m + "%";
                        
                        if (currentTemp < 18) {
                            document.getElementById("insight").innerText = "Chilly morning! Grab your school jumper. 🧥";
                        } else if (data.daily.precipitation_probability_max[0] > 40) {
                            document.getElementById("insight").innerText = "Rain predicted! Pack an umbrella today. 🌧️☔";
                        } else {
                            document.getElementById("insight").innerText = "Ready for a great day at Churchie! ☀️";
                        }

                        var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                        var html = "";
                        for (var i = 0; i < 7; i++) {
                            var dateParts = data.daily.time[i].split("-");
                            var dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                            var dayName = days[dateObj.getDay()];
                            var max = Math.round(data.daily.temperature_2m_max[i]);
                            var min = Math.round(data.daily.temperature_2m_min[i]);
                            var rain = data.daily.precipitation_probability_max[i];
                            html += '<div class="weather-row"><span class="day">' + dayName + '</span><span><span class="rain-pct">' + rain + '% 💧</span>' + min + '° / ' + max + '°</span></div>';
                        }
                        document.getElementById("forecast-box").innerHTML = html;
                    } catch (e) { }
                }
            };
            xhr.send();
        }
        getWeather(); setInterval(getWeather, 600000);

        function parseICal(icalText) {
            var events = [];
            var lines = icalText.split(/\r?\n/);
            var currentEvent = null;
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.indexOf("BEGIN:VEVENT") === 0) {
                    currentEvent = {};
                } else if (line.indexOf("END:VEVENT") === 0) {
                    if (currentEvent && currentEvent.summary) events.push(currentEvent);
                    currentEvent = null;
                } else if (currentEvent) {
                    if (line.indexOf("SUMMARY:") === 0) currentEvent.summary = line.substring(8);
                    if (line.indexOf("DTSTART:") === 0) currentEvent.start = line.substring(8);
                    if (line.indexOf("DTSTART;VALUE=DATE:") === 0) currentEvent.start = line.substring(19);
                }
            }
            return events;
        }

        function fetchCalendars() {
            var allEvents = [];
            var proxy = "https://corsproxy.io";
            
            var loadGoogle = function(callback) {
                if (!GOOGLE_ICAL || GOOGLE_ICAL.indexOf("PASTE") !== -1) { callback(); return; }
                var xhr = new XMLHttpRequest();
                xhr.open("GET", proxy + encodeURIComponent(GOOGLE_ICAL), true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        allEvents = allEvents.concat(parseICal(xhr.responseText));
                    }
                    if (xhr.readyState === 4) callback();
                };
                xhr.send();
            };

            var loadChurchie = function() {
                if (!CHURCHIE_ICAL || CHURCHIE_ICAL.indexOf("PASTE") !== -1) { renderEvents(); return; }
                var xhr = new XMLHttpRequest();
                xhr.open("GET", proxy + encodeURIComponent(CHURCHIE_ICAL), true);
Use code with caution.xhr.onreadystatechange = function() {if (xhr.readyState === 4 && xhr.status === 200) {allEvents = allEvents.concat(parseICal(xhr.responseText));}if (xhr.readyState === 4) renderEvents();};xhr.send();};var renderEvents = function() {allEvents.sort(function(a, b) { return (a.start || "").localeCompare(b.start || ""); });var html = "";var displayCount = Math.min(allEvents.length, 6);if (displayCount === 0) {html = "No upcoming events found--";} else {for (var i = 0; i < displayCount; i++) {var ev = allEvents[i];var dateStr = "Event";if (ev.start && ev.start.length >= 8) {var y = parseInt(ev.start.substring(0, 4), 10);var m = parseInt(ev.start.substring(4, 6), 10) - 1;var d = parseInt(ev.start.substring(6, 8), 10);var dObj = new Date(y, m, d);var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];dateStr = dObj.getDate() + " " + months[dObj.getMonth()];}html += '' + ev.summary + '' + dateStr + '';}}document.getElementById("events-table").innerHTML = html;};loadGoogle(loadChurchie);}fetchCalendars(); setInterval(fetchCalendars, 1800000);
